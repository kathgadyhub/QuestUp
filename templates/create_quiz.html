<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizUp - Create Quiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =========================================
           CREATE QUIZ
           ========================================= */

        .quiz-builder {
            width: min(1000px, 92%);
            margin: 40px auto 80px;
        }


        .page-header {
            margin-bottom: 28px;
        }


        .small-title {
            color: #6542e8;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }


        .page-header h1 {
            margin: 0;
            font-size: 34px;
            color: #202044;
        }


        .page-header p:last-child {
            margin-top: 8px;
            color: #777;
        }


        /* =========================================
           FORM CARD
           ========================================= */

        .form-card {
            background: white;
            border-radius: 22px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: 0 12px 35px rgba(54, 38, 120, 0.08);
        }


        .form-card h2 {
            color: #22204a;
            margin-top: 0;
            margin-bottom: 22px;
        }


        .form-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }


        .form-card-header h2 {
            margin: 0;
        }


        .question-number {
            background: #eee9ff;
            color: #5c3be0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }


        /* =========================================
           LABELS
           ========================================= */

        .form-card label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #20244d;
            font-size: 14px;
            font-weight: 700;
        }


        /* =========================================
           INPUTS
           ========================================= */

        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #e2e1f2;
            border-radius: 13px;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            color: #202044;
            background: white;
            outline: none;
            transition: 0.2s ease;
        }


        .form-card textarea {
            resize: vertical;
            min-height: 110px;
        }


        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            border-color: #6842ee;
            box-shadow: 0 0 0 4px rgba(104, 66, 238, 0.08);
        }


        /* =========================================
           ANSWER OPTIONS
           ========================================= */

        .answer-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }


        .answer-option span {
            width: 38px;
            height: 38px;
            min-width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #6542e8;
            color: white;
            border-radius: 10px;
            font-weight: 800;
        }


        .answer-option input {
            margin: 0;
        }


        /* =========================================
           QUESTION CARD
           ========================================= */

        .question-card {
            border: 2px solid #ece9fa;
            border-radius: 18px;
            padding: 24px;
            margin-top: 20px;
            background: #fff;
            animation: questionAppear 0.25s ease;
        }


        @keyframes questionAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .question-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }


        .question-card-title {
            color: #5d3cdd;
            font-weight: 800;
            font-size: 17px;
        }


        .remove-question {
            border: none;
            background: #ffecef;
            color: #c72d52;
            border-radius: 9px;
            padding: 8px 13px;
            cursor: pointer;
            font-weight: 700;
        }


        .remove-question:hover {
            background: #ffdbe3;
        }


        /* =========================================
           ACTIONS
           ========================================= */

        .quiz-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }


        .secondary-btn,
        .primary-btn {
            border: none;
            border-radius: 13px;
            padding: 14px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .secondary-btn {
            background: #eeeaff;
            color: #5b3bd7;
        }


        .primary-btn {
            background: #6542e8;
            color: white;
            box-shadow: 0 8px 18px rgba(101, 66, 232, 0.22);
        }


        .secondary-btn:hover,
        .primary-btn:hover {
            transform: translateY(-2px);
        }


        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        /* =========================================
           QUESTION COUNT
           ========================================= */

        #questionCount {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 650px) {

            .quiz-builder {
                width: 94%;
                margin-top: 25px;
            }


            .form-card {
                padding: 20px;
            }


            .page-header h1 {
                font-size: 28px;
            }


            .form-card-header {
                align-items: flex-start;
                flex-direction: column;
            }


            .quiz-actions {
                flex-direction: column;
            }


            .quiz-actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
     ========================================= -->

<nav class="navbar">

    <a href="/dashboard" class="logo">
        🎯 QuizUp
    </a>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

    </div>

</nav>



<!-- =========================================
     MAIN
     ========================================= -->

<main class="quiz-builder">


    <div class="page-header">

        <p class="small-title">
            HOST
        </p>

        <h1>
            Create Your Quiz
        </h1>

        <p>
            Build questions for your players.
        </p>

        <div id="questionCount">
            1 question
        </div>

    </div>



    <!-- =========================================
         QUIZ INFORMATION
         ========================================= -->

    <section class="form-card">

        <h2>
            1. Quiz Information
        </h2>


        <label for="quizTitle">
            Quiz Title
        </label>

        <input
            type="text"
            id="quizTitle"
            placeholder="Example: General Knowledge"
            required
        >


        <label for="gameMode">
            Game Mode
        </label>

        <select id="gameMode">

            <option value="classic">
                🎮 Classic Mode - Timed
            </option>

            <option value="team">
                👥 Team Mode - Timed
            </option>

            <option value="accuracy">
                🎯 Accuracy Mode - No Timer
            </option>

        </select>

    </section>



    <!-- =========================================
         QUESTIONS CONTAINER
         ========================================= -->

    <div id="questionsContainer">


        <!-- =====================================
             QUESTION 1
             ===================================== -->

        <section class="form-card question-card">

            <div class="question-card-header">

                <div class="question-card-title">
                    Question 1
                </div>

            </div>


            <label>
                Question Type
            </label>

            <select class="question-type">

                <option value="multiple_choice">
                    Multiple Choice
                </option>

                <option value="true_false">
                    True or False
                </option>

                <option value="jumbled">
                    Jumbled Words
                </option>

                <option value="type_answer">
                    Type Answer
                </option>

            </select>


            <label>
                Your Question
            </label>

            <textarea
                class="question-text"
                rows="4"
                placeholder="Write your question here..."
            ></textarea>


            <!-- MULTIPLE CHOICE -->

            <div class="multiple-choice-section">

                <label>
                    Answer Choices
                </label>


                <div class="answer-option">

                    <span>A</span>

                    <input
                        type="text"
                        class="option-a"
                        placeholder="Choice A"
                    >

                </div>


                <div class="answer-option">

                    <span>B</span>

                    <input
                        type="text"
                        class="option-b"
                        placeholder="Choice B"
                    >

                </div>


                <div class="answer-option">

                    <span>C</span>

                    <input
                        type="text"
                        class="option-c"
                        placeholder="Choice C"
                    >

                </div>


                <div class="answer-option">

                    <span>D</span>

                    <input
                        type="text"
                        class="option-d"
                        placeholder="Choice D"
                    >

                </div>

            </div>


            <label>
                Correct Answer
            </label>

            <input
                type="text"
                class="correct-answer"
                placeholder="Example: A"
            >


            <label>
                Timer
            </label>

            <select class="timer">

                <option value="10">
                    10 seconds
                </option>

                <option value="20">
                    20 seconds
                </option>

                <option value="30" selected>
                    30 seconds
                </option>

                <option value="60">
                    60 seconds
                </option>

                <option value="0">
                    No Timer
                </option>

            </select>

        </section>

    </div>



    <!-- =========================================
         BUTTONS
         ========================================= -->

    <div class="quiz-actions">

        <button
            type="button"
            id="addQuestionBtn"
            class="secondary-btn"
        >
            + Add Question
        </button>


        <button
            type="button"
            id="createQuizBtn"
            class="primary-btn"
        >
            Create Quiz
        </button>

    </div>


</main>



<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =========================================
       ELEMENTS
       ========================================= */

    const addQuestionBtn =
        document.getElementById("addQuestionBtn");

    const createQuizBtn =
        document.getElementById("createQuizBtn");

    const questionsContainer =
        document.getElementById("questionsContainer");

    const questionCount =
        document.getElementById("questionCount");



    /* =========================================
       UPDATE QUESTION NUMBERS
       ========================================= */

    function updateQuestionNumbers() {

        const cards =
            questionsContainer.querySelectorAll(
                ".question-card"
            );


        cards.forEach(function (card, index) {

            const title =
                card.querySelector(
                    ".question-card-title"
                );


            title.textContent =
                "Question " + (index + 1);


            /* Remove button */

            let removeButton =
                card.querySelector(
                    ".remove-question"
                );


            if (cards.length > 1) {

                if (!removeButton) {

                    removeButton =
                        document.createElement("button");

                    removeButton.type = "button";

                    removeButton.className =
                        "remove-question";

                    removeButton.textContent =
                        "Remove";


                    removeButton.addEventListener(
                        "click",
                        function () {

                            card.remove();

                            updateQuestionNumbers();

                        }
                    );


                    card
                        .querySelector(
                            ".question-card-header"
                        )
                        .appendChild(removeButton);

                }

            } else {

                if (removeButton) {

                    removeButton.remove();

                }

            }

        });


        const total =
            cards.length;


        questionCount.textContent =
            total +
            (total === 1
                ? " question"
                : " questions");

    }



    /* =========================================
       QUESTION TYPE
       ========================================= */

    function setupQuestionType(card) {

        const type =
            card.querySelector(".question-type");

        const multipleChoice =
            card.querySelector(
                ".multiple-choice-section"
            );

        const correctAnswer =
            card.querySelector(
                ".correct-answer"
            );


        type.addEventListener(
            "change",
            function () {

                if (
                    type.value ===
                    "multiple_choice"
                ) {

                    multipleChoice.style.display =
                        "block";

                    correctAnswer.placeholder =
                        "Example: A";

                } else {

                    multipleChoice.style.display =
                        "none";

                    correctAnswer.placeholder =
                        type.value === "true_false"
                            ? "Example: True"
                            : "Enter the correct answer";

                }

            }
        );

    }



    /* =========================================
       INITIAL QUESTION
       ========================================= */

    document
        .querySelectorAll(".question-card")
        .forEach(function (card) {

            setupQuestionType(card);

        });



    /* =========================================
       ADD QUESTION
       ========================================= */

    addQuestionBtn.addEventListener(
        "click",
        function () {


            /*
             * Kunin ang unang question card
             * bilang template.
             */

            const firstCard =
                questionsContainer.querySelector(
                    ".question-card"
                );


            /*
             * Clone ang buong question card.
             */

            const newCard =
                firstCard.cloneNode(true);


            /*
             * Linisin lahat ng input.
             */

            newCard
                .querySelectorAll("input")
                .forEach(function (input) {

                    input.value = "";

                });


            /*
             * Linisin textarea.
             */

            newCard
                .querySelectorAll("textarea")
                .forEach(function (textarea) {

                    textarea.value = "";

                });


            /*
             * Reset question type.
             */

            const newType =
                newCard.querySelector(
                    ".question-type"
                );

            newType.value =
                "multiple_choice";


            /*
             * Ipakita ulit ang choices.
             */

            const choices =
                newCard.querySelector(
                    ".multiple-choice-section"
                );

            choices.style.display =
                "block";


            /*
             * Reset timer.
             */

            const newTimer =
                newCard.querySelector(
                    ".timer"
                );

            newTimer.value =
                "30";


            /*
             * Tanggalin ang existing
             * remove button mula sa clone.
             */

            const oldRemove =
                newCard.querySelector(
                    ".remove-question"
                );

            if (oldRemove) {

                oldRemove.remove();

            }


            /*
             * Ilagay ang bagong card
             * sa container.
             */

            questionsContainer.appendChild(
                newCard
            );


            /*
             * I-activate ang question type.
             */

            setupQuestionType(
                newCard
            );


            /*
             * Update numbering.
             */

            updateQuestionNumbers();


            /*
             * Dalhin ang screen sa
             * bagong question.
             */

            newCard.scrollIntoView({

                behavior: "smooth",

                block: "center"

            });


            /*
             * Focus sa question.
             */

            newCard
                .querySelector(
                    ".question-text"
                )
                .focus();

        }
    );



    /* =========================================
       CREATE QUIZ
       ========================================= */

    createQuizBtn.addEventListener(
        "click",
        async function () {


            const title =
                document
                    .getElementById("quizTitle")
                    .value
                    .trim();


            const gameMode =
                document
                    .getElementById("gameMode")
                    .value;


            /* ==============================
               CHECK TITLE
               ============================== */

            if (!title) {

                alert(
                    "Please enter a Quiz Title."
                );

                document
                    .getElementById("quizTitle")
                    .focus();

                return;

            }



            /* ==============================
               GET QUESTIONS
               ============================== */

            const cards =
                questionsContainer.querySelectorAll(
                    ".question-card"
                );


            const questions = [];


            let invalid = false;


            cards.forEach(function (card, index) {


                const type =
                    card.querySelector(
                        ".question-type"
                    ).value;


                const text =
                    card.querySelector(
                        ".question-text"
                    ).value
                    .trim();


                const optionA =
                    card.querySelector(
                        ".option-a"
                    ).value
                    .trim();


                const optionB =
                    card.querySelector(
                        ".option-b"
                    ).value
                    .trim();


                const optionC =
                    card.querySelector(
                        ".option-c"
                    ).value
                    .trim();


                const optionD =
                    card.querySelector(
                        ".option-d"
                    ).value
                    .trim();


                const answer =
                    card.querySelector(
                        ".correct-answer"
                    ).value
                    .trim();


                const timer =
                    parseInt(
                        card.querySelector(
                            ".timer"
                        ).value
                    ) || 0;



                /* ==========================
                   QUESTION TEXT
                   ========================== */

                if (!text) {

                    alert(
                        "Please enter the question for Question " +
                        (index + 1) +
                        "."
                    );

                    card
                        .querySelector(
                            ".question-text"
                        )
                        .focus();

                    invalid = true;

                    return;

                }



                /* ==========================
                   CORRECT ANSWER
                   ========================== */

                if (!answer) {

                    alert(
                        "Please enter the correct answer for Question " +
                        (index + 1) +
                        "."
                    );

                    card
                        .querySelector(
                            ".correct-answer"
                        )
                        .focus();

                    invalid = true;

                    return;

                }



                /* ==========================
                   MULTIPLE CHOICE
                   ========================== */

                if (
                    type ===
                    "multiple_choice"
                ) {


                    if (
                        !optionA ||
                        !optionB ||
                        !optionC ||
                        !optionD
                    ) {

                        alert(
                            "Please complete Choices A, B, C and D for Question " +
                            (index + 1) +
                            "."
                        );

                        invalid = true;

                        return;

                    }


                    const upperAnswer =
                        answer.toUpperCase();


                    if (
                        upperAnswer !== "A" &&
                        upperAnswer !== "B" &&
                        upperAnswer !== "C" &&
                        upperAnswer !== "D"
                    ) {

                        alert(
                            "Correct Answer for Question " +
                            (index + 1) +
                            " must be A, B, C or D."
                        );

                        invalid = true;

                        return;

                    }

                }



                /* ==========================
                   TRUE / FALSE
                   ========================== */

                if (
                    type ===
                    "true_false"
                ) {

                    const lowerAnswer =
                        answer.toLowerCase();


                    if (
                        lowerAnswer !== "true" &&
                        lowerAnswer !== "false"
                    ) {

                        alert(
                            "Correct Answer for Question " +
                            (index + 1) +
                            " must be True or False."
                        );

                        invalid = true;

                        return;

                    }

                }



                /* ==========================
                   ADD QUESTION TO ARRAY
                   ========================== */

                questions.push({

                    question_type:
                        type,

                    question_text:
                        text,

                    option_a:
                        optionA,

                    option_b:
                        optionB,

                    option_c:
                        optionC,

                    option_d:
                        optionD,

                    correct_answer:
                        answer,

                    timer:
                        timer

                });

            });



            if (invalid) {

                return;

            }



            /* ==============================
               SEND TO FLASK
               ============================== */

            createQuizBtn.disabled =
                true;


            createQuizBtn.textContent =
                "Creating Quiz...";


            try {


                const response =
                    await fetch(
                        "/api/create-quiz",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    title:
                                        title,

                                    game_mode:
                                        gameMode,

                                    questions:
                                        questions

                                })

                        }
                    );



                const result =
                    await response.json();



                if (response.ok) {

                    alert(
                        "Quiz created successfully!"
                    );


                    window.location.href =
                        "/dashboard";

                } else {

                    alert(
                        result.error ||
                        "Failed to create quiz."
                    );

                }


            } catch (error) {

                console.error(
                    "CREATE QUIZ ERROR:",
                    error
                );


                alert(
                    "Could not connect to the server. Please make sure Flask is running."
                );

            }


            createQuizBtn.disabled =
                false;


            createQuizBtn.textContent =
                "Create Quiz";

        }
    );


    /*
     * Initial numbering
     */

    updateQuestionNumbers();

});

</script>


</body>

</html>
