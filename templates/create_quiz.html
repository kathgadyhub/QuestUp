
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizUp - Create Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f3ff;
            color: #252044;
            min-height: 100vh;
        }

        nav {
            background: #6d28d9;
            color: white;
            padding: 17px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 3px 12px #35206b20;
        }

        .logo {
            color: white;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
        }

        nav a.back {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        main {
            max-width: 900px;
            width: 92%;
            margin: 35px auto;
            padding-bottom: 40px;
        }

        .page-heading {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: #7c3aed;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(27px, 5vw, 36px);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #746e8b;
            line-height: 1.6;
        }

        .panel {
            background: white;
            border: 1px solid #e9e2ff;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 8px 30px #49318c0b;
        }

        h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dcd6ed;
            border-radius: 10px;
            background: white;
            color: #252044;
            font: inherit;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #8b5cf61c;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        .question-card {
            border: 1px solid #e7defe;
            border-radius: 15px;
            padding: 21px;
            margin-bottom: 18px;
            background: #fdfcff;
        }

        .question-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .question-top h3 {
            font-size: 17px;
            color: #6d28d9;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 15px;
        }

        .hidden {
            display: none !important;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 17px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(0.97);
        }

        .remove-btn {
            background: #fee2e2;
            color: #b91c1c;
            padding: 9px 12px;
            font-size: 13px;
        }

        .add-btn {
            width: 100%;
            border: 2px dashed #c4b5fd;
            color: #6d28d9;
            background: #f5f3ff;
            margin-bottom: 22px;
        }

        .save-btn {
            width: 100%;
            background: #6d28d9;
            color: white;
            padding: 15px;
            font-size: 16px;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .notice {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .notice.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .notice.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .footer-note {
            font-size: 12px;
            color: #817995;
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            main {
                width: 94%;
                margin-top: 24px;
            }

            .panel {
                padding: 17px;
            }

            .question-card {
                padding: 15px;
            }

            .two-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="/dashboard" class="logo">🎯 QuizUp</a>
        <a href="/dashboard" class="back">← Back to Dashboard</a>
    </nav>

    <main>
        <header class="page-heading">
            <p class="eyebrow">HOST CENTER</p>
            <h1>Create Your Quiz</h1>
            <p class="subtitle">
                Create your quiz, add as many questions as you need,
                and prepare your players to learn while playing.
            </p>
        </header>

        <div id="notice" class="notice" role="alert"></div>

        <form id="quizForm">
            <section class="panel">
                <h2>📝 Quiz Details</h2>

                <label for="quizTitle">Quiz Title</label>
                <input
                    type="text"
                    id="quizTitle"
                    name="title"
                    placeholder="e.g. General Knowledge Quiz"
                    maxlength="150"
                    required
                >

                <label for="gameMode">Game Mode</label>
                <select id="gameMode" name="game_mode">
                    <option value="classic">Classic</option>
                    <option value="team">Team Mode</option>
                    <option value="accuracy">Accuracy Mode</option>
                </select>
            </section>

            <section class="panel">
                <h2>💡 Quiz Questions</h2>
                <div id="questionsContainer"></div>

                <button type="button" id="addQuestionBtn" class="add-btn">
                    + Add Another Question
                </button>

                <button type="submit" id="saveQuizBtn" class="save-btn">
                    Save Quiz
                </button>

                <p class="footer-note">
                    Make sure every question has a correct answer before saving.
                </p>
            </section>
        </form>
    </main>

    <script>
        const form = document.getElementById("quizForm");
        const container = document.getElementById("questionsContainer");
        const addButton = document.getElementById("addQuestionBtn");
        const saveButton = document.getElementById("saveQuizBtn");
        const notice = document.getElementById("notice");

        let questionCount = 0;

        function showNotice(message, type = "error") {
            notice.textContent = message;
            notice.className = "notice " + type;
            notice.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        function clearNotice() {
            notice.textContent = "";
            notice.className = "notice";
        }

        function addQuestion() {
            questionCount++;

            const card = document.createElement("section");
            card.className = "question-card";

            card.innerHTML = `
                <div class="question-top">
                    <h3 class="question-heading">Question</h3>
                    <button type="button" class="remove-btn">
                        Remove
                    </button>
                </div>

                <label>Question Type</label>
                <select class="question-type">
                    <option value="multiple_choice">Multiple Choice</option>
                    <option value="true_false">True or False</option>
                    <option value="jumbled">Puzzle / Jumbled Words</option>
                    <option value="type_answer">Type Answer</option>
                </select>

                <label>Question</label>
                <textarea
                    class="question-text"
                    placeholder="Write your question here..."
                    required
                ></textarea>

                <div class="choice-fields">
                    <div class="two-columns">
                        <div>
                            <label>Option A</label>
                            <input class="option-a" type="text"
                                placeholder="First option">
                        </div>
                        <div>
                            <label>Option B</label>
                            <input class="option-b" type="text"
                                placeholder="Second option">
                        </div>
                        <div>
                            <label>Option C</label>
                            <input class="option-c" type="text"
                                placeholder="Third option">
                        </div>
                        <div>
                            <label>Option D</label>
                            <input class="option-d" type="text"
                                placeholder="Fourth option">
                        </div>
                    </div>
                </div>

                <label class="answer-label">Correct Answer</label>
                <input
                    class="correct-answer"
                    type="text"
                    placeholder="Enter the correct answer"
                    required
                >

                <label>Time Limit</label>
                <select class="question-timer">
                    <option value="10">10 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="30" selected>30 seconds</option>
                    <option value="60">60 seconds</option>
                    <option value="90">90 seconds</option>
                </select>
            `;

            container.appendChild(card);

            const typeSelect = card.querySelector(".question-type");

            typeSelect.addEventListener("change", () => {
                updateQuestionFields(card);
            });

            card.querySelector(".remove-btn").addEventListener("click", () => {
                card.remove();
                renumberQuestions();
                clearNotice();
            });

            updateQuestionFields(card);
            renumberQuestions();
        }

        function updateQuestionFields(card) {
            const type = card.querySelector(".question-type").value;
            const choices = card.querySelector(".choice-fields");
            const answerInput = card.querySelector(".correct-answer");
            const answerLabel = card.querySelector(".answer-label");

            choices.classList.toggle(
                "hidden",
                type !== "multiple_choice"
            );

            if (type === "true_false") {
                answerInput.placeholder = "Type True or False";
                answerLabel.textContent = "Correct Answer (True or False)";
            } else if (type === "jumbled") {
                answerInput.placeholder = "Enter the unscrambled word";
                answerLabel.textContent = "Correct Unscrambled Answer";
            } else if (type === "type_answer") {
                answerInput.placeholder = "Enter the expected answer";
                answerLabel.textContent = "Expected Answer";
            } else {
                answerInput.placeholder = "Enter the correct option";
                answerLabel.textContent = "Correct Answer (type the option text)";
            }
        }

        function renumberQuestions() {
            const cards = container.querySelectorAll(".question-card");

            cards.forEach((card, index) => {
                card.querySelector(".question-heading").textContent =
                    `Question ${index + 1}`;
            });
        }

        function collectQuestions() {
            const cards = container.querySelectorAll(".question-card");
            const questions = [];

            for (let index = 0; index < cards.length; index++) {
                const card = cards[index];

                const type = card.querySelector(".question-type").value;
                const questionText = card.querySelector(".question-text").value.trim();
                const correctAnswer = card.querySelector(".correct-answer").value.trim();

                const optionA = card.querySelector(".option-a").value.trim();
                const optionB = card.querySelector(".option-b").value.trim();
                const optionC = card.querySelector(".option-c").value.trim();
                const optionD = card.querySelector(".option-d").value.trim();

                if (!questionText) {
                    throw new Error(`Please enter the text for Question ${index + 1}.`);
                }

                if (!correctAnswer) {
                    throw new Error(`Please enter the correct answer for Question ${index + 1}.`);
                }

                if (type === "multiple_choice") {
                    if (!optionA || !optionB || !optionC || !optionD) {
                        throw new Error(`Please complete all four options for Question ${index + 1}.`);
                    }

                    const options = [optionA, optionB, optionC, optionD];

                    if (!options.some(option =>
                        option.toLowerCase() === correctAnswer.toLowerCase()
                    )) {
                        throw new Error(
                            `The correct answer for Question ${index + 1} must match one of its options.`
                        );
                    }
                }

                if (type === "true_false" &&
                    !["true", "false"].includes(correctAnswer.toLowerCase())) {
                    throw new Error(
                        `Question ${index + 1}: the answer must be True or False.`
                    );
                }

                questions.push({
                    question_type: type,
                    question_text: questionText,
                    option_a: type === "true_false" ? "True" : optionA,
                    option_b: type === "true_false" ? "False" : optionB,
                    option_c: optionC,
                    option_d: optionD,
                    correct_answer: correctAnswer,
                    timer: Number(card.querySelector(".question-timer").value)
                });
            }

            if (questions.length === 0) {
                throw new Error("Please add at least one question.");
            }

            return questions;
        }

        addButton.addEventListener("click", () => {
            addQuestion();
            clearNotice();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            clearNotice();

            let questions;

            try {
                questions = collectQuestions();
            } catch (error) {
                showNotice(error.message);
                return;
            }

            const title = document.getElementById("quizTitle").value.trim();
            const gameMode = document.getElementById("gameMode").value;

            if (!title) {
                showNotice("Please enter a quiz title.");
                return;
            }

            saveButton.disabled = true;
            addButton.disabled = true;
            saveButton.textContent = "Saving Quiz...";

            try {
                const response = await fetch("/api/create-quiz", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        game_mode: gameMode,
                        questions: questions
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Failed to save quiz."
                    );
                }

                showNotice(
                    "Quiz saved successfully! Redirecting to dashboard...",
                    "success"
                );

                saveButton.textContent = "Quiz Saved!";

                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 1200);

            } catch (error) {
                showNotice(error.message || "An unexpected error occurred.");
                saveButton.disabled = false;
                addButton.disabled = false;
                saveButton.textContent = "Save Quiz";
            }
        });

        // Start with one question.
        addQuestion();
    </script>
</body>
</html>
