<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QuizUp - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <a href="/" class="auth-logo">
            🎯 QuizUp
        </a>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue playing and learning.
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->

        <form
            action="{{ url_for('login') }}"
            method="POST"
        >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>


        <a
            href="{{ url_for('home') }}"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
