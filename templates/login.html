<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizUp - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-page">


<div class="auth-container">

    <div class="auth-card">

        <a href="/" class="auth-logo">
            🎯 QuizUp
        </a>

        <h1>
            Welcome Back!
        </h1>

        <p class="auth-subtitle">
            Login to continue your QuizUp journey.
        </p>


        <form action="/dashboard" method="GET">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn full-btn">

                Login

            </button>

        </form>


        <p class="auth-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>


        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</div>


</body>
</html>
